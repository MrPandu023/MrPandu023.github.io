<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Projects | Mukesh Pandeya</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            amber: '#f59e0b',
                            red: '#ef4444'
                        },
                        darkbg: '#0a0a0c'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        * {
            cursor: url('../pictures/cursor.webp') 16 16, auto;
        }

        h1, .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        .bg-watermark {
            background: url('../pictures/Mr_pandu_logo_1.jpg') center / cover fixed no-repeat;
        }

        .bg-theme-overlay {
            background: linear-gradient(145deg, rgba(48, 34, 5, 0.24), rgba(21, 17, 8, 0.48));
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        .project-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 12px 32px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-darkbg text-slate-100 selection:bg-brand-500 selection:text-black">
    <div class="fixed inset-0 z-0 bg-watermark opacity-35 pointer-events-none" aria-hidden="true"></div>
    <div class="fixed inset-0 z-0 bg-theme-overlay pointer-events-none" aria-hidden="true"></div>
    <div class="fixed left-1/2 top-1/4 z-0 h-[500px] w-[500px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-brand-amber/15 blur-[140px] pointer-events-none" aria-hidden="true"></div>

    <div class="relative z-10 flex min-h-screen flex-col">
        <main class="mx-auto flex w-full max-w-6xl flex-grow flex-col px-4 py-8 sm:px-8">
            <a href="portfolio_website.html" class="project-card inline-flex w-fit items-center gap-2 rounded-full px-5 py-3 text-sm font-semibold text-white transition-colors hover:text-brand-400">
                <span aria-hidden="true">&larr;</span>
                Back to portfolio
            </a>

            <section class="space-y-8 pt-8 pb-16">
                <div class="glass-panel flex flex-col items-center gap-1 rounded-2xl px-6 py-4 text-center sm:px-8">
                    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-brand-400">Portfolio Highlights</p>
                    <h1 class="text-3xl font-bold text-white sm:text-4xl">FiveM Dev Projects</h1>
                </div>

                <div class="mx-auto grid w-full max-w-6xl grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
                    <article class="project-card rounded-2xl p-6 transition-transform duration-300 hover:-translate-y-1">
                        <h2 class="mb-2 text-lg font-bold text-white">Trial center</h2>
                        <p class="text-sm leading-relaxed text-slate-200">Project showcase coming soon.</p>
                    </article>
                </div>
            </section>
        </main>

        <footer class="border-t border-slate-800/80 px-4 py-6 text-center text-xs text-slate-400 sm:px-8">
            &copy; <span id="year"></span> Mukesh Pandeya. All rights reserved.
        </footer>
    </div>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
