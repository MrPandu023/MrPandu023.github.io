<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Musical moments, live performances, and memorable programs by Mukesh Pandeya.">
    <title>Musical Moments | Mukesh Pandeya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pages/interest-pages.css">
    <style>
        .moment-event-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
            margin-right: auto;
            margin-left: auto;
            max-width: 56rem;
        }

        .moment-feature-photo {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 4 / 5;
            margin: 0;
            overflow: hidden;
            border: 1px solid rgba(252, 211, 77, .4);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, .35);
        }

        .moment-feature-photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .moment-upcoming-photo {
            background: linear-gradient(145deg, rgba(245, 158, 11, .18), rgba(15, 23, 42, .9));
        }

        .moment-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.25rem;
            color: #f1f5f9;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
        }

        .moment-overlay::before {
            position: absolute;
            z-index: 0;
            inset: 0;
            opacity: 0;
            transform: translateY(100%);
            background: rgba(15, 23, 42, .7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            content: "";
            transition: transform 650ms ease, opacity 450ms ease;
            -webkit-mask-image: linear-gradient(to top, #000 0%, #000 35%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, #000 35%, transparent 100%);
        }

        .moment-overlay-title {
            position: relative;
            z-index: 1;
            margin-bottom: .5rem;
            font-family: "Space Grotesk", Inter, Arial, sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .moment-overlay-description {
            position: relative;
            z-index: 1;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateY(1rem);
            font-size: .875rem;
            line-height: 1.6;
            color: #f1f5f9;
            transition: max-height 650ms ease, transform 650ms ease, opacity 450ms ease;
        }

        .band-gallery {
            width: 100%;
            margin-top: 2.5rem;
            padding: 1.5rem;
            border-radius: 1.5rem;
        }

        .band-gallery h2 {
            margin-bottom: 1.25rem;
            color: #f8fafc;
            font-size: 1.5rem;
            text-align: center;
        }

        .band-photo-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1rem;
        }

        .band-photo-slot {
            position: relative;
            display: block;
            width: 100%;
            padding: 0;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 0;
            border-radius: 1rem;
            background: rgba(255, 255, 255, .08);
            cursor: pointer;
        }

        .band-photo-slot:focus-visible {
            outline: 2px solid #facc15;
            outline-offset: 4px;
        }

        .band-photo-slot img {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 700ms cubic-bezier(.2, .75, .25, 1), opacity 500ms ease;
        }

        .band-photo-parents {
            z-index: 2;
        }

        .band-photo-dashain {
            z-index: 1;
            transform: translate(-10px, 10px) scale(.97);
            opacity: .78;
        }

        .band-photo-slot.show-dashain .band-photo-dashain {
            transform: none;
            opacity: 1;
        }

        .band-photo-slot.show-dashain .band-photo-parents {
            transform: translate(105%, -8%) rotate(9deg) scale(.94);
            opacity: 0;
        }

        .band-photo-hint {
            position: absolute;
            z-index: 3;
            right: 0;
            bottom: 0;
            left: 0;
            padding: .9rem 1rem;
            background: linear-gradient(transparent, rgba(15, 23, 42, .8));
            color: #fff;
            font-size: .875rem;
            text-align: center;
            pointer-events: none;
        }

        .moment-event:hover .moment-overlay::before,
        .moment-feature-photo:focus-visible .moment-overlay::before {
            opacity: 1;
            transform: translateY(0);
        }

        .moment-event:hover .moment-overlay-description,
        .moment-feature-photo:focus-visible .moment-overlay-description {
            max-height: 15rem;
            opacity: 1;
            transform: translateY(0);
        }

        .moment-feature-photo:focus-visible {
            outline: 2px solid #facc15;
            outline-offset: 4px;
        }

        @media (min-width: 40rem) {
            .moment-event-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

    </style>
</head>
<body>
    <div class="bg-watermark" aria-hidden="true"></div>
    <div class="bg-theme-overlay" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="page">
        <main>
            <a class="back" href="/"><span aria-hidden="true">&larr;</span> Back to portfolio</a>
            <section>
                <div class="glass-panel section-heading">
                    <p class="eyebrow">Passions &amp; Lifestyle</p>
                    <h1>Musical Moments</h1>
                </div>

                <div class="moment-event-grid">
                    <article class="moment-event">
                        <figure class="moment-feature-photo" tabindex="0" aria-label="Annual Day 2020 performance details">
                            <img src="/pictures/class9_performance.jpg" alt="Class 9 musical performance">
                            <span class="moment-overlay">
                                <span class="moment-overlay-title">Annual Day 2020</span>
                                <span class="moment-overlay-description">Held on Poush 14 for SAMB’s Annual Day, this performance took place during the COVID period, with only a small audience in the hall. I played the keyboard alongside my seniors and, as the youngest artist, made a memory I’ll always cherish.</span>
                            </span>
                        </figure>
                    </article>
                    <article class="moment-event">
                        <figure class="moment-feature-photo" tabindex="0" aria-label="Performance details">
                            <img src="/pictures/stage_performance.jpg" alt="Keyboard performance at a live event">
                            <span class="moment-overlay">
                                <span class="moment-overlay-title">Parent’s Day 2023</span>
                                <span class="moment-overlay-description">I played guitar at this program in front of a lively audience of parents and guests in the auditorium. We performed multiple songs in this program and were delighted by the warm praise and encouragement from the audience.</span>
                            </span>
                        </figure>
                    </article>
                    <article class="moment-event">
                        <figure class="moment-feature-photo" tabindex="0" aria-label="Add another program photo and details">
                            <img src="/pictures/stage_performance2.jpg" alt="Add a photo from another musical program">
                            <span class="moment-overlay">
                                <span class="moment-overlay-title">Dashain Program 2023</span>
                                <span class="moment-overlay-description">At SAMB’s open-air Dashain celebration, my band and I performed “Sanskriti” by Mantra Band on the main stage before a huge, concert-like crowd. As lead guitarist, I played electric guitar and powered the performance with chords that helped make the moment unforgettable.</span>
                            </span>
                        </figure>
                    </article>
                    <article class="moment-event">
                        <figure class="moment-feature-photo moment-upcoming-photo" tabindex="0" aria-label="Upcoming performance">
                            <span class="moment-overlay">
                                <span class="moment-overlay-title">Yet to Perform</span>
                                <span class="moment-overlay-description">A new musical moment is on the way. Check back after my next performance for photos and details.</span>
                            </span>
                        </figure>
                    </article>
                </div>

                <div class="band-gallery glass-panel">
                    <h2>Some Moments with the Band</h2>
                    <div class="band-photo-grid">
                        <button class="band-photo-slot" id="bandPhotoShuffle" type="button" aria-label="Show Dashain band performance photo" aria-pressed="false" title="Click to shuffle band photos">
                            <img class="band-photo-parents" src="/pictures/band_parentsday.JPG" alt="Band performing at Parent’s Day">
                            <img class="band-photo-dashain" src="/pictures/band_dashain.JPG" alt="Band performing at Dashain">
                            <span class="band-photo-hint">Click to see more</span>
                        </button>
                    </div>
                </div>

            </section>
        </main>
        <footer>&copy; <span id="year"></span> Mukesh Pandeya. All rights reserved.</footer>
    </div>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const bandPhotoShuffle = document.getElementById('bandPhotoShuffle');
        bandPhotoShuffle.addEventListener('click', () => {
            const showingDashain = bandPhotoShuffle.classList.toggle('show-dashain');
            bandPhotoShuffle.setAttribute('aria-pressed', String(showingDashain));
            bandPhotoShuffle.setAttribute(
                'aria-label',
                showingDashain ? 'Show Parent’s Day band performance photo' : 'Show Dashain band performance photo'
            );
        });
    </script>
</body>
</html>
